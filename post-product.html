<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Post Product</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#0f0f0f;color:white;font-family:Arial;padding:20px;}.container{max-width:600px;margin:0 auto;}.back{color:#00ff88;text-decoration:none;display:block;margin-bottom:20px;}h1{color:#00ff88;text-align:center;margin-bottom:20px;}.form-box{background:#151515;padding:25px;border-radius:15px;}.form-group{margin-bottom:18px;}label{display:block;margin-bottom:8px;color:#aaa;}input,textarea{width:100%;padding:14px;background:#222;border:1px solid #333;border-radius:10px;color:white;}textarea{min-height:100px;}.btn{background:#00ff88;color:#000;padding:16px;border-radius:10px;border:none;font-weight:bold;width:100%;font-size:16px;cursor:pointer;}.image-upload{border:2px dashed #333;border-radius:12px;padding:20px;text-align:center;cursor:pointer;}.image-preview{width:100%;max-height:250px;object-fit:cover;border-radius:10px;margin-top:10px;display:none;}.payment-box{display:none;background:#151515;padding:25px;border-radius:15px;text-align:center;margin-top:20px;}.warning{background:#2a1f00;color:#ffaa00;padding:15px;border-radius:12px;margin-bottom:20px;font-size:13px;}.qr-box{background:white;padding:20px;border-radius:15px;display:inline-block;}.address-box{background:#1a1a1a;padding:18px;border-radius:12px;margin:20px 0;word-break:break-all;}.address{color:#00ff88;font-family:monospace;}</style></head><body><div class="container"><a href="index.html" class="back">← Back</a><div id="formSection"><h1>Post Product - $2 Fee</h1><div class="form-box"><form id="postForm"><div class="form-group"><label>Product Image *</label><div class="image-upload" onclick="productImage.click()"><span id="uploadText">📷 Tap to Upload</span><img id="imagePreview" class="image-preview"></div><input type="file" id="productImage" accept="image/*" style="display:none;" required></div><div class="form-group"><label>Product Name *</label><input id="productName" required></div><div class="form-group"><label>Description *</label><textarea id="productDesc" required></textarea></div><div class="form-group"><label>Email</label><input type="email" id="productEmail"></div><div class="form-group"><label>WhatsApp *</label><input id="productWhatsapp" required></div><div class="form-group"><label>Price $ *</label><input type="number" id="productPrice" step="0.01" required></div><button class="btn">Continue to Payment $2</button></form></div></div><div id="paymentSection" class="payment-box"><h1>Pay $2 to Publish</h1><div class="warning">⚠️ Only send Tether USDT (TRC20)</div><div class="qr-box"><img id="qrCode" width="260"></div><div class="address-box"><div>USDT TRC20 Address</div><div class="address" id="walletAddress">TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T</div><button class="btn" onclick="navigator.clipboard.writeText('TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T')">📋 Copy</button></div></div></div><script>if(localStorage.getItem("marketSaleLoggedIn")!== "true")location.href="login.html";const WALLET="TRzfCcrUmc212VLEYNYVRKtSuYQSnaiU6T";let imgData='';productImage.onchange=e=>{let r=new FileReader();r.onload=ev=>{imgData=ev.target.result;imagePreview.src=imgData;imagePreview.style.display='block';uploadText.style.display='none';};r.readAsDataURL(e.target.files[0]);};postForm.onsubmit=e=>{e.preventDefault();if(!imgData)return alert("Upload image");let data={name:productName.value,desc:productDesc.value,email:productEmail.value,whatsapp:productWhatsapp.value,price:productPrice.value,seller:JSON.parse(localStorage.getItem("marketSaleUser")).name,image:imgData};formSection.style.display='none';paymentSection.style.display='block';qrCode.src=`https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${WALLET}`;walletAddress.innerText=WALLET;setTimeout(()=>save(data),2000);};function save(d){let p=JSON.parse(localStorage.getItem("marketSalePending"))||[];p.push({id:Date.now(),title:d.name,...d});localStorage.setItem("marketSalePending",JSON.stringify(p));alert("Submitted! Waiting for admin approval.");location.href="index.html";}</script></body></html>
